<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>
</head>
<link rel="stylesheet" href="style.css">
<script src="js/calculo.js"></script>
<body>
    <div class="container">
    <h1><div class="texto">Minha Calculadora</div></h1>
    <div class="texto">Primeiro Número</div>
    <input type="number" id="n1" class="input"><br>
    <div class="texto">Segundo Número</div>
    <input type="number" id="n2" class="input"><br>
    <div class="botoes">
        <button onclick="somar()" class="botao">Somar</button>
        <button onclick="subtrair()" class="botao">Subtrair</button>
        <button onclick="multiplicar()" class="botao">Multiplicar</button>
        <button onclick="dividir()" class="botao">Dividir</button>
        <button onclick="triangulo()" class="botao">Área do triângulo</button>
        <button onclick="quadrado()" class="botao">Área do quadrado</button><br>
    </div>

    <span id="resultado" class="texto"></span><br><br>
    <div class="texto">Terceiro Número</div>
    <input type="number" id="n3" class="input"><br>
    <div class="botoes">
        <button onclick="dez()" class="botao">Retirar 10%</button>
        <button onclick="lucro()" class="botao">Lucro 15%</button>
        <button onclick="desconto()" class="botao">Desconto 3%</button>
        <button onclick="se()" class="botao">Botão Se?</button><br>
    </div>
    <span id="resultado2" class="texto"></span>
    <script src="js/calculo.js"></script>
    </div>
</body>
</html>
